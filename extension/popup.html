<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Footprint Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #f8f8f8;
    }
    header {
      background: #4f46e5;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header h1 { font-size: 14px; font-weight: 600; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ef4444; flex-shrink: 0;
    }
    .dot.green { background: #22c55e; }
    section { padding: 16px; }
    .section-title {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: #999; margin-bottom: 12px;
    }
    label {
      display: block; margin-bottom: 4px;
      font-weight: 500; color: #555; font-size: 12px;
    }
    input {
      width: 100%; padding: 8px 10px;
      border: 1px solid #ddd; border-radius: 6px;
      font-size: 13px; margin-bottom: 10px;
      outline: none;
    }
    input:focus { border-color: #4f46e5; }
    .btn {
      width: 100%; padding: 9px;
      background: #4f46e5; color: white;
      border: none; border-radius: 6px;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { background: #4338ca; }
    .btn-red { background: #ef4444; margin-top: 8px; }
    .btn-red:hover { background: #dc2626; }
    .btn-outline {
      background: white; color: #4f46e5;
      border: 1px solid #4f46e5; margin-top: 8px;
    }
    .stat-row {
      display: flex; justify-content: space-between;
      align-items: center; padding: 7px 0;
      border-bottom: 1px solid #eee;
    }
    .stat-row:last-of-type { border-bottom: none; }
    .stat-val { font-weight: 700; color: #4f46e5; }
    .error { color: #ef4444; font-size: 12px; margin-top: 6px; min-height: 16px; }
    .current-url {
      font-size: 11px; color: #888; margin-top: 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>
<body>

<header>
  <div class="dot" id="dot"></div>
  <h1>Digital Footprint Tracker</h1>
</header>

<!-- LOGIN VIEW -->
<section id="login-view">
  <p class="section-title">Sign in to start tracking</p>
  <label>Email</label>
  <input type="email" id="email" placeholder="test@test.com">
  <label>Password</label>
  <input type="password" id="password" placeholder="pass123">
  <button class="btn" id="login-btn">Sign in</button>
  <p class="error" id="err"></p>
</section>

<!-- STATUS VIEW (hidden by default) -->
<section id="status-view" style="display:none">
  <p class="section-title">Today's activity</p>
  <div class="stat-row">
    <span>Sites visited</span>
    <span class="stat-val" id="s-visits">—</span>
  </div>
  <div class="stat-row">
    <span>Time online</span>
    <span class="stat-val" id="s-time">—</span>
  </div>
  <div class="stat-row">
    <span>Social visits</span>
    <span class="stat-val" id="s-social">—</span>
  </div>
  <div class="stat-row">
    <span>Unique sites</span>
    <span class="stat-val" id="s-domains">—</span>
  </div>
  <p class="current-url" id="s-url"></p>
  <button class="btn btn-outline" id="dash-btn">Open dashboard ↗</button>
  <button class="btn btn-red" id="logout-btn">Sign out</button>
</section>

<script src="popup.js"></script>
</body>
</html>
